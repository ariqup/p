<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelola Kartu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --page-bg:#EEF1F5;
    --card-bg:#FFFFFF;
    --text-primary:#101828;
    --text-secondary:#667085;
    --border:#E4E7EC;
    --border-focus:#2F6FED;
    --accent:#2F6FED;
    --accent-hover:#2559C7;
    --danger:#D92D20;
    --danger-bg:#FEF3F2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--page-bg);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--text-primary);
    padding:32px 16px;
  }
  .card{
    width:100%;
    max-width:420px;
    background:var(--card-bg);
    border-radius:28px;
    box-shadow:0 20px 40px -16px rgba(16,24,40,0.18), 0 2px 6px rgba(16,24,40,0.06);
    padding:32px 28px 28px;
  }
  h1{font-size:24px; font-weight:700; margin:0 0 10px; letter-spacing:-0.01em;}
  .desc{font-size:14px; line-height:1.55; color:var(--text-secondary); margin:0 0 24px;}
  button{
    width:100%; height:52px; border:none; border-radius:14px; background:var(--accent); color:#fff;
    font-size:15px; font-weight:600; font-family:inherit; cursor:pointer;
  }
  button:hover{background:var(--accent-hover);}
  button.secondary{background:#F2F4F7; color:var(--text-primary); margin-top:12px;}
  button.secondary:hover{background:#E4E7EC;}
  #reader{
    width:100%;
    border-radius:16px;
    overflow:hidden;
    margin-bottom:16px;
    display:none;
  }
  .error-msg{
    font-size:13px; color:var(--danger); background:var(--danger-bg); border-radius:10px;
    padding:10px 12px; margin-top:14px; display:none;
  }
  .divider{border:none; border-top:1px solid var(--border); margin:24px 0;}
  label{display:block; font-size:13px; font-weight:600; margin-bottom:8px;}
  input{
    width:100%; height:48px; border:1.5px solid var(--border); border-radius:14px;
    padding:0 16px; font-size:14px; font-family:inherit; outline:none; margin-bottom:12px;
  }
  input:focus{border-color:var(--border-focus); box-shadow:0 0 0 4px rgba(47,111,237,0.12);}
</style>
</head>
<body>

<div class="card">
  <h1>Kelola Kartu</h1>
  <p class="desc">Scan QR di kartu Anda untuk mengedit info bisnis, link Google Review, PIN, atau mereset kartu.</p>

  <div id="reader"></div>

  <button id="scanBtn">Scan QR Kartu</button>
  <p class="error-msg" id="scanError"></p>

  <hr class="divider">

  <label for="manualCode">Atau masukkan kode kartu manual</label>
  <input type="text" id="manualCode" placeholder="Contoh: AB3XK9Q2" autocomplete="off">
  <button class="secondary" id="manualBtn">Buka Halaman Kelola</button>
</div>

<script>
// Ganti sesuai domain halaman aktivasi kamu
const BASE_ACTIVATION_URL = 'https://ariqup.github.io/kartu/';

const scanBtn = document.getElementById('scanBtn');
const readerEl = document.getElementById('reader');
const scanError = document.getElementById('scanError');
let html5QrCode = null;
let scanning = false;

function extractCardCode(scannedText) {
  try {
    const url = new URL(scannedText);
    const code = url.searchParams.get('kode');
    if (code) return code;
  } catch (e) {
    // Bukan URL valid, kemungkinan cuma teks kode polos
  }
  // Fallback: kalau yang di-scan cuma teks kode polos (bukan URL), pakai apa adanya
  if (/^[A-Za-z0-9]{4,}$/.test(scannedText.trim())) {
    return scannedText.trim();
  }
  return null;
}

function goToManage(code) {
  const separator = BASE_ACTIVATION_URL.includes('?') ? '&' : '?';
  window.location.href = BASE_ACTIVATION_URL + separator + 'kode=' + encodeURIComponent(code) + '&kelola=1';
}

async function startScanning() {
  scanError.style.display = 'none';
  readerEl.style.display = 'block';
  scanBtn.textContent = 'Batalkan Scan';
  scanning = true;

  html5QrCode = new Html5Qrcode('reader');

  try {
    await html5QrCode.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: 240 },
      (decodedText) => {
        const code = extractCardCode(decodedText);
        stopScanning();
        if (code) {
          goToManage(code);
        } else {
          scanError.textContent = 'QR yang di-scan bukan QR kartu yang valid. Coba lagi.';
          scanError.style.display = 'block';
        }
      },
      () => { /* diabaikan: error per-frame saat belum nemu QR */ }
    );
  } catch (err) {
    scanning = false;
    readerEl.style.display = 'none';
    scanBtn.textContent = 'Scan QR Kartu';
    scanError.textContent = 'Tidak bisa mengakses kamera. Pastikan izin kamera diizinkan di browser, atau gunakan kode manual di bawah.';
    scanError.style.display = 'block';
  }
}

function stopScanning() {
  if (html5QrCode && scanning) {
    html5QrCode.stop().catch(() => {});
  }
  scanning = false;
  readerEl.style.display = 'none';
  scanBtn.textContent = 'Scan QR Kartu';
}

scanBtn.addEventListener('click', () => {
  if (scanning) {
    stopScanning();
  } else {
    startScanning();
  }
});

document.getElementById('manualBtn').addEventListener('click', () => {
  const code = document.getElementById('manualCode').value.trim();
  scanError.style.display = 'none';

  if (!code) {
    scanError.textContent = 'Isi kode kartu terlebih dahulu.';
    scanError.style.display = 'block';
    return;
  }
  goToManage(code);
});
</script>

</body>
</html>
